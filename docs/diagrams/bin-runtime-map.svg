<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1050" viewBox="0 0 1680 1050" role="img" aria-labelledby="title desc">
  <title id="title">S31 to S3 bin runtime map</title>
  <desc id="desc">Repository ownership and runtime flow from UI and camera on S31, through the game controller and ESP-NOW, to servos and time-of-flight sensors on S3, and back as DROP feedback.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #d6deea; stroke-width: 2; }
      .s31 { fill: #eef6ff; stroke: #2d6cdf; stroke-width: 2.5; }
      .s3 { fill: #fff4e8; stroke: #d76b13; stroke-width: 2.5; }
      .core { fill: #effaf5; stroke: #18875b; stroke-width: 2.5; }
      .warn { fill: #fff8e6; stroke: #b7791f; stroke-width: 2.5; }
      .evidence { fill: #f3f1ff; stroke: #6554c0; stroke-width: 2.5; }
      .title { font: 700 36px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #14213d; }
      .subtitle { font: 500 18px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #516179; }
      .section { font: 700 24px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #14213d; }
      .boxTitle { font: 700 20px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #14213d; }
      .body { font: 400 15px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #33415c; }
      .path { font: 500 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #516179; }
      .label { font: 600 14px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #44536b; }
      .warnText { font: 700 15px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #8a4b00; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .arrowBlue { fill: none; stroke: #2d6cdf; stroke-width: 3; marker-end: url(#arrowBlue); }
      .arrowOrange { fill: none; stroke: #d76b13; stroke-width: 3; marker-end: url(#arrowOrange); }
      .arrowGreen { fill: none; stroke: #18875b; stroke-width: 3; marker-end: url(#arrowGreen); }
      .dash { stroke-dasharray: 8 7; }
      .warnText { font: 700 15px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #8a4b00; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#2d6cdf"/></marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#d76b13"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#18875b"/></marker>
  </defs>
  <rect class="bg" width="1680" height="1050"/>
  <text x="64" y="62" class="title">分類小隊：S31 → S3 bin runtime map</text>
  <text x="64" y="94" class="subtitle">codex/espnow-game-plan · 2026-11-24 · 實線 = code path；虛線 = feedback / debug signal</text>
  <rect x="48" y="122" width="760" height="880" rx="24" fill="#eef6ff" opacity="0.48"/>
  <rect x="832" y="122" width="800" height="880" rx="24" fill="#fff4e8" opacity="0.44"/>
  <text x="72" y="158" class="section">ESP32-S31：眼、腦、臉、聲</text>
  <text x="856" y="158" class="section">ESP32-S3：四蓋與四 TOF</text>

  <rect x="80" y="190" width="270" height="130" rx="18" class="s31"/>
  <text x="100" y="222" class="boxTitle">UI / shell</text>
  <text x="100" y="250" class="body">Touch、PLAY、GAME / CHAT</text>
  <text x="100" y="276" class="path">app/stc_shell_mode.c</text>
  <text x="100" y="300" class="body">UI 只發 action contract</text>

  <rect x="80" y="380" width="270" height="150" rx="18" class="s31"/>
  <text x="100" y="412" class="boxTitle">相機 + 模型</text>
  <text x="100" y="440" class="body">5 幀 → int8 ESP-DL → category</text>
  <text x="100" y="466" class="path">stc_vision_aggregate.c</text>
  <text x="100" y="490" class="path">models/wordless-padded/*.espdl</text>
  <text x="100" y="514" class="body">結果經 controller，不直接改分</text>

  <rect x="420" y="190" width="340" height="130" rx="18" class="core"/>
  <text x="440" y="222" class="boxTitle">Game controller</text>
  <text x="440" y="250" class="body">UI / vision / hand event 的匯流點</text>
  <text x="440" y="276" class="path">app/stc_game_controller.c</text>
  <text x="440" y="300" class="body">決定 fault 與 render</text>

  <rect x="420" y="380" width="340" height="150" rx="18" class="core"/>
  <text x="440" y="412" class="boxTitle">遊戲 FSM（唯一改分）</text>
  <text x="440" y="440" class="body">PROMPT → SCAN → OPEN → DROP</text>
  <text x="440" y="466" class="body">→ SETTLE → CLOSE → LEARNING</text>
  <text x="440" y="492" class="path">firmware/common/stc_game.c</text>
  <text x="440" y="516" class="path">contracts/stc_game.h</text>

  <rect x="80" y="590" width="270" height="120" rx="18" class="s31"/>
  <text x="100" y="622" class="boxTitle">聲效 / 畫面 feedback</text>
  <text x="100" y="650" class="body">PCM clips、learning、summary</text>
  <text x="100" y="676" class="path">firmware/assets/voice + stc_ui.c</text>

  <rect x="420" y="590" width="340" height="185" rx="18" class="panel"/>
  <text x="440" y="622" class="boxTitle">Board wiring</text>
  <text x="440" y="650" class="path">esp32-s31-korvo-1-stc/</text>
  <text x="440" y="674" class="body">production runtime + xiao-zhi shell</text>
  <text x="440" y="702" class="path">firmware/esp32s31/game/</text>
  <text x="440" y="726" class="body">standalone bring-up target</text>
  <text x="440" y="752" class="body">兩者共用 game / hand / UI contracts</text>

  <rect x="820" y="250" width="300" height="240" rx="18" class="s31"/>
  <text x="842" y="282" class="boxTitle">ESP-NOW hand link</text>
  <text x="842" y="310" class="body">ch 6 · no encryption · 16 B frame</text>
  <text x="842" y="338" class="path">stc_hand_link.c</text>
  <text x="842" y="366" class="body">OPEN_ALL / CLOSE_ALL</text>
  <text x="842" y="392" class="body">ACK + retry · heartbeat 1 s</text>
  <text x="842" y="420" class="path">espnow_controller.c</text>
  <text x="842" y="448" class="body">STATE 帶 VIRTUAL flag 可分辨 peer</text>
  <text x="842" y="472" class="body">但 S31 現時未把 flag 顯示出來</text>

  <rect x="1190" y="250" width="380" height="240" rx="18" class="s3"/>
  <text x="1212" y="282" class="boxTitle">S3 game_hand</text>
  <text x="1212" y="310" class="body">heartbeat 250 ms + command receiver</text>
  <text x="1212" y="338" class="path">firmware/esp32s3/game_hand/main/app_main.c</text>
  <text x="1212" y="366" class="body">收到 OPEN_ALL / CLOSE_ALL</text>
  <text x="1212" y="392" class="body">start round → settle → TOF baseline</text>
  <text x="1212" y="418" class="body">detect first confirmed bin → send DROP</text>
  <text x="1212" y="446" class="warnText">現行：先 ACK，後才 apply servo</text>
  <text x="1212" y="470" class="body">所以 lid_open=1 只等於 ACK</text>

  <rect x="1190" y="565" width="380" height="130" rx="18" class="s3"/>
  <text x="1212" y="597" class="boxTitle">4 × servo</text>
  <text x="1212" y="625" class="body">GPIO12/13/14/15 · 50 Hz</text>
  <text x="1212" y="651" class="path">servo_lids.c · close 1450 / open 1575 µs</text>
  <text x="1212" y="677" class="body">獨立 5 V + 共地；PWM stop 後需重建</text>

  <rect x="1190" y="735" width="380" height="150" rx="18" class="s3"/>
  <text x="1212" y="767" class="boxTitle">4 × TOF050C / VL6180X</text>
  <text x="1212" y="795" class="body">I²C SDA8 / SCL9 · XSHUT GPIO4–7</text>
  <text x="1212" y="821" class="path">runtime addr 0x30..0x33 · model 0xB4</text>
  <text x="1212" y="847" class="body">baseline → 15 s detect → candidate streak</text>
  <text x="1212" y="871" class="path">tof4.c + firmware/common/stc_tof_drop.c</text>

  <rect x="820" y="565" width="300" height="230" rx="18" class="warn"/>
  <text x="842" y="597" class="boxTitle">診斷時要分開三件事</text>
  <text x="842" y="628" class="warnText">1. hand_online=1</text>
  <text x="860" y="650" class="body">有 heartbeat</text>
  <text x="842" y="678" class="warnText">2. lid_open=1</text>
  <text x="860" y="700" class="body">有 matching ACK，不是位置回授</text>
  <text x="842" y="728" class="warnText">3. S3 log ALL_LIDS_OPEN</text>
  <text x="860" y="750" class="body">才是 servo 真正寫 PWM 的證據</text>
  <text x="842" y="776" class="body">Virtual hand 亦會令 1 和 2 成立。</text>

  <rect x="80" y="800" width="680" height="170" rx="18" class="evidence"/>
  <text x="102" y="832" class="boxTitle">已驗證 vs 未驗證（2026-11-24）</text>
  <text x="102" y="862" class="body">已驗證：TOF probe 4/4、四 servo simultaneous cycling 可動。</text>
  <text x="102" y="888" class="body">已驗證：S31 ↔ real hand 的 ESP-NOW、四 servo、四 TOF、DROP/ACK 完整流程。</text>
  <text x="102" y="914" class="body">實機持有人已確認 2026-11-24 build fully working。</text>
  <text x="102" y="942" class="warnText">仍未做：每桶 controlled drop accuracy matrix。</text>

  <path d="M350 255 L420 255" class="arrowBlue"/>
  <text x="356" y="242" class="label">action</text>
  <path d="M350 455 L420 455" class="arrowGreen"/>
  <text x="355" y="442" class="label">vision result</text>
  <path d="M590 320 L590 380" class="arrowGreen"/>
  <text x="600" y="350" class="label">state changes</text>
  <path d="M760 455 C790 455 795 370 820 370" class="arrowBlue"/>

  <path d="M1120 370 L1190 370" class="arrowOrange"/>
  <text x="1124" y="356" class="label">ESP-NOW</text>
  <path d="M1120 430 C1150 430 1150 470 1190 470" class="arrowOrange dash"/>

  <path d="M1380 490 L1380 565" class="arrowOrange"/>
  <text x="1390" y="530" class="label">servo PWM</text>
  <path d="M1380 695 L1380 735" class="arrowOrange"/>
  <text x="1390" y="717" class="label">range</text>
  <path d="M1190 810 C1125 810 1125 470 1120 470" class="arrowOrange dash"/>

  <path d="M820 300 C790 300 790 255 760 255" class="arrowGreen dash"/>
  <text x="788" y="286" class="label">ACK</text>
  <path d="M420 620 L350 620" class="arrowGreen"/>
  <text x="356" y="607" class="label">feedback</text>

  <rect x="48" y="1020" width="1584" height="2" fill="#d6deea"/>
  <text x="64" y="1042" class="path">Source of truth: contracts/ + firmware/common/test + runs/ raw logs. Build success ≠ hardware pass.</text>
</svg>
