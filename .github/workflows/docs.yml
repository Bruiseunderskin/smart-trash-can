name: Documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 tools/check_docs.py
      - run: python3 -m unittest discover -s tools/tests -p test_check_docs.py -v
      - run: python3 -m unittest discover -s tools/tests -p test_dev.py -v
