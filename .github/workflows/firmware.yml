name: Firmware compile
on:
  push:
    paths: ['firmware/**', 'app/**', 'contracts/**', 'tools/dev.py', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', 'app/**', 'contracts/**', 'tools/dev.py', '.github/workflows/firmware.yml']
  workflow_dispatch:
concurrency:
  group: firmware-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  common-tests:
    name: Host C tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake gcc
      - name: Configure
        run: cmake -S firmware/common/test -B build/common-test -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/common-test -j
      - name: Run ctest
        run: ctest --test-dir build/common-test --output-on-failure
  arduino:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [ESP32S3_Mic_Test, MG90_LidServo_ESP32S3, PCA9685_4Servo_Test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install pinned board and library
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install ESP32Servo@3.0.9
      - run: python3 tools/dev.py compile --project ${{ matrix.project }}
  esp-idf:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [pca9685_servo_test, tflite_probe, smart-trash-can, stc_node]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare public latency model
        if: matrix.project == 'tflite_probe'
        shell: bash
        run: |
          curl --fail --location --retry 3 --output firmware/esp32s3/tflite_probe/main/models/waste4_int8.tflite https://raw.githubusercontent.com/tensorflow/tflite-micro/main/tensorflow/lite/micro/models/person_detect.tflite
          echo '808cfdfc0cf3a6fa6f6fa26bfa379ea97c16d5db7334637766e39c3408502e9d  firmware/esp32s3/tflite_probe/main/models/waste4_int8.tflite' | sha256sum --check
      - name: Compile
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/dev.py compile --project ${{ matrix.project }}
  esp32s31:
    name: S31 (${{ matrix.project }})
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [s31_bringup, esp32-s31-korvo-1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile S31 with preview target support
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/dev.py compile --project ${{ matrix.project }}
